name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # better-sqlite3 has no prebuild for every runner and the compiler only
      # needs its type definitions, so the native build is skipped here. The
      # Docker job below compiles it for real.
      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: herald:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail

          # No bot token: it must still boot and serve, just without a bot.
          # WebSub secrets are supplied so the callback's rejection paths are
          # exercised rather than short-circuiting on missing configuration,
          # and polling is off so the test makes no outbound calls.
          docker run -d --name herald-ci -p 8080:8080 \
            -e POLL_INTERVAL_MS=0 \
            -e WEBSUB_CALLBACK_BASE_URL=https://herald.invalid \
            -e WEBSUB_VERIFY_TOKEN=ci-verify-token \
            -e WEBSUB_SECRET=ci-secret \
            herald:ci

          # Poll rather than sleep a fixed amount: fast when it is fast, and it
          # prints the container log if it never comes up.
          for i in $(seq 1 30); do
            if [ "$(curl -fsS http://localhost:8080/api/health 2>/dev/null)" = "ok" ]; then
              echo "health ok after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container did not become healthy in 30s"
              docker logs herald-ci
              exit 1
            fi
            sleep 1
          done

          # The dashboard must actually be served, not just the API.
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

          # A client-side route must fall through to the SPA, not 404.
          curl -fsS http://localhost:8080/servers/123 | grep -q 'id="root"'

          # An unsigned webhook must be rejected before anything is parsed.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/api/websub/callback \
            -H 'content-type: application/atom+xml' --data '<feed/>')
          test "$code" = "403" || { echo "::error::unsigned webhook got $code, expected 403"; exit 1; }

          # So must a verification handshake carrying the wrong token.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/api/websub/callback?hub.mode=subscribe&hub.challenge=x&hub.verify_token=wrong")
          test "$code" = "403" || { echo "::error::bad verify token got $code, expected 403"; exit 1; }

          # An unknown API path is JSON, not the SPA.
          curl -s http://localhost:8080/api/nope | grep -q '"error"'

          docker rm -f herald-ci
